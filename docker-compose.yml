services:
  db:
    image: postgres:16-alpine
    container_name: potly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: potly
      POSTGRES_USER: potly
      POSTGRES_PASSWORD: potly_dev
    ports:
      - "5433:5432"
    volumes:
      - potly_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potly -d potly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  potly_data:
